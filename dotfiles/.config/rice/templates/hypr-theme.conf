general {
    gaps_in = {{gap_in}}
    gaps_out = {{gap_out}}
    border_size = {{border_size}}
    col.active_border = rgb({{accent.hex}}) rgb({{accent_alt.hex}}) 45deg
    col.inactive_border = rgb({{border.hex}})
}
decoration {
    rounding = {{rounding}}
    active_opacity = {{opacity_active}}
    inactive_opacity = {{opacity_inactive}}
    blur {
        enabled = {{blur}}
        size = {{blur_size}}
        passes = 2
    }
    shadow {
        enabled = {{shadow}}
        range = 12
        render_power = 3
        color = rgba({{fg.hex}}22)
    }
}
